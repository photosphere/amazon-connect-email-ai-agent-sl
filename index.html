const DATA = {"scenarios": [{"id": "thread", "name": "新邮件 / 回复邮件识别与多轮上下文", "tags": ["Req 5 多轮", "Req 6 上下文保留"], "focus": "通用", "difficulty": "低", "diff_reason": "规则在 triage.detect_thread；案例号格式、判定窗口（30 天）、同主题规则都是参数。", "customize": ["调整案例号格式或主题模板（agent.reply_subject）", "放宽/收紧同主题匹配窗口", "对接既有工单号（如 PMS trace）做关联"], "verified": "本地多轮用例 S1、F2、F3 第二封均识别为 REPLY 并引用上一轮内容。Connect 线程字段结构已用实例上真实联系记录核对（新邮件 ContactAssociationId=自身；Send message 发出的邮件 RelatedContactId=来信）；7 个线程判定用例（新邮件、回复 AI、回复旧邮件形成树、DescribeContact 失败退回案例号、线程根不在 PoC、转发、无关联 Re:）全部通过。客人真实回复的联系记录尚未在实例上实测。", "variants": [{"name": "新邮件", "steps": [[0, "客人发来邮件", "发往 reservations@ / rewards@ / 各酒店预订邮箱。SES 收信，正文与附件存入实例的 S3 存储。"], [1, "入站 Email Flow", "CheckEmailChannel：$.Channel = EMAIL；开启 flow 日志。"], [2, "triage：读信", "flow 同步调用 triage（8 秒）。ListContactReferences + GetAttachedFile 读取正文与附件清单。"], [2, "新邮件 / 回复判定", "DescribeContact 取 Connect 线程字段：新邮件没有 RelatedContactId 且 ContactAssociationId 等于自身；回复邮件的 RelatedContactId 指向它回复的那封（我们发出的 outbound），ContactAssociationId 指向线程根。依次匹配 RelatedContactId → 其上一跳 → 线程根 → [Ref: EA-xxxx] 案例号 → 回复前缀 + 同主题未结案例；Fwd 转发按新邮件处理。", "d"], [2, "防护 + Claude Haiku 分类", "SES 垃圾/病毒判定、自动回复/退信、聊天转邮件、钓鱼特征；Haiku 识别语言、多意图 Dcode、酒店、情绪、投诉、是否要求人工。"], [4, "案例写入 DynamoDB", "CASE（案例状态）、THREAD（联系→案例）、CUSTOMER（发件人最近案例）。"], [3, "异步启动 agent", "Lambda Invoke(Event)。flow 进入 Wait 10s ⇄ poll 循环等待结果（最多 30 次）。"], [3, "Claude 读取邮件 + 空历史", "encounter=first，问候语用“Greetings from Example Hotel Group!”"], [3, "grounding 自检", "第二次 Claude 调用逐条核对回复中的事实是否有 KB / 工具证据；有无证据的陈述则转人工审核。", "d"], [3, "模板组信", "代码拼接：称呼 + 标准问候（首次/再次/示例会员俱乐部）+ 正文 + 标准结束语 + 所在邮箱的官方签名。"], [1, "poll 取回结果", "disposition = AUTO_SEND，写入联系属性。"], [1, "Send message", "CreateContact(RelatedContact=CURRENT) + StartOutboundEmailContact，从客人来信的同一邮箱回复。"], [0, "客人收到回复", "主题带 [Ref: EA-xxxx]，客人回复时可自动归入同一案例。", "e"]]}, {"name": "回复邮件", "steps": [[0, "客人回复邮件", "客人直接回复 AI 的邮件（主题含 [Ref: EA-xxxx]）。"], [1, "入站 Email Flow", "CheckEmailChannel：$.Channel = EMAIL；开启 flow 日志。"], [2, "triage：读信", ation: 2 nights\nOccupancy: 2 rooms (1 adult + 1 child per room)\nRate Plan: Flexible Rate (FLEX)\nRate per Room per Night: RMB 800++\nRate per Room (2 nights, inclusive): RMB 1,865.60\nTotal for 2 Rooms (inclusive): RMB 3,731.20\n\nRates are inclusive of 10% Service Charge and 6% VAT.\n\nCancellation Policy (Flexible Rate): Cancellations made after 18:00 local hotel time, one day prior to arrival, will be subject to a one-night room charge, plus applicable service charges, taxes, and fees.\n\nPayment: A credit card is required to guarantee the reservation; the room rate will be charged upon check-out.\n\nThe Lakeview Room features a 180-degree lake view, Bryte Mattress, spacious bathtub, Personal Host Service, and breakfast at Herbs Garden is included.\n\nRegarding dining for your children: your child aged 5 (6 years and below) can enjoy buffet meals at our all-day dining venue at no additional charge when accompanied by a dine-in adult. Your child aged 8 (above 6 but under 12 years) will receive a 50% discount on the adult buffet price.\n\nPlease note that no reservation has been made at this stage. Should you wish to confirm the booking, kindly let us know and we will proceed right away. We would also be happy to arrange a room upgrade or special room decoration should you be celebrating any special occasion during your stay.\n\nWe look forward to welcoming you and your family to Lakeside Hotel Hangzhou.\n\nWe look forward to hearing from you soon. Please do not hesitate to contact us for further assistance.\n\nYours sincerely,\n\nAI Assistant\nCustomer Service Executive\nCustomer Experience Centre\nE. reservations@example-hotels.com\nT. Worldwide Reservations Number", "summary": "Guest Mr. Lee Chong Wei requested a quote for 2 Lakeview rooms (FLEX), 1–3 Jul 2026, 2 adults + 2 children (ages 5 & 8). Rooms available at RMB 800++ per room per night; total inclusive RMB 3,731.20 for 2 rooms/2 nights. Occupancy split: 1 adult + 1 child per room. No booking made yet; HTL-INFO hotel=HGH1 reason=none", "result": "disposition=HUMAN_REVIEW team=RESERVATIONS grounding=5/6 actions=none esc=grounding check: The pool is complimentary for all in-house guests", "tools": "[('search_knowledge_base', 'OK')]", "reply": "Dear Mr./Ms.,\n\nGreetings from Example Hotel Group!\n\nThank you for choosing Example Hotels & Resorts as the preferred accommodation.\n\nThank you for reaching out, and we look forward to welcoming you to Lakeside Hotel Hangzhou next month!\n\nHere are the details for our swimming pool:\n\n    Details\nLocation: Level B1 (Basement 1)\nOpening Hours: 6:00 am – 11:00 pm daily\nType: Indoor, heated (constant temperature)\nPool Size: 20 m × 10 m\n\nThe pool is complimentary for all in-house guests. Should you have any other questions before your arrival, please do not hesitate to get in touch — we are always happy to help.\n\nThank you for writing to us. Please do not hesitate to contact us should you require further assistance.\n\nYours sincerely,\nAI Assistant\nReservations\nLakeside Hotel Hangzhou\nE. reservations.hgh1@example-lakeside.com\nT. ++00 0000 0000\nExample Road, Xihu District, 310007 Hangzhou, China\nexample-hotels.com", "summary": "Guest asked about swimming pool hours and location at Lakeside Hotel. AI answered: pool is on B1, open 6am–11pm daily, indoor heated, 20x10m, complimentary for in-house guests. No action outstanding.", "ms": 15511}, {"key": "S6-1", "label": "Sample 6：Executive Club 权益 + 会议室价格", "triage": "type=NEW evidence=none route=AI mode=AUTO lang=en dcodes=HTL-INFO,RSV-QUOTE,HTL-INFO hotel=SZX1 reason=none", "result": "disposition=HUMAN_REVIEW team=RESERVATIONS grounding=19/21 actions=none esc=grounding check: Complimentary pressing of one suit/dress per stay; Mercedes Benz S Class capacity up to 3 pax + 3 luggage from SZX at RMB 750 nett ", "tools": "[('search_knowledge_base', 'OK'), ('search_knowledge_base', 'OK'), ('get_hotel_policy', 'OK')]", "reply": "Dear Edwin,\n\nGreetings from Example Hotel Group!\n\nThank you for choosing Example Hotels & Resorts as the preferred accommodation.\n\nThank you for reaching out to Futian City Hotel, Shenzhen — we look forward to welcoming you for your business trip!\n\nAllow me to address each of your questions below.\n\nExecutive Club Lounge — Inclusions & Breakfast\n\nThe Executive Club Lounge is located on Level 37 and is exclusively accessible to guests staying in Executive Club rooms and suites. Here is a summary of what is included:\n\n- Buffet breakfast served daily (Mon–Fri: 6:30am–10:30am; Sat–Sun: 6:30am–11:00am) — yes, breakfast is included\n- Afternoon tea (1:00pm–5:00pm)\n- Evening cocktails with canapés (6:00pm–8:00pm)\n- Coffee, tea and soft drinks available throughout the day\n- Complimentary use of the meeting room for 2 hours per day (subject to availability)\n- Late check-out until 4:00pm on the day of departure (subject to availability)\n- Private check-in and check-out at the Executive Club reception on Level 37\n- Complimentary pressing of one suit/dress per stay\n- First round of minibar complimentary during your stay\n- Computer workstation available for use at the lounge\n\nBreakfast can also be taken at our Café / All Day Dining Restaurant as an alternative.\n\nMeeting Room\n\nFor guests staying in a Executive Club room or suite, the meeting room (capacity up to 16 persons, 2 rooms available) is complimentary for 2 hours per day. Additional hours beyond the complimentary allocation are charged at RMB 280 nett per hour.\n\nFor guests not staying in a Executive Club room, meeting room availability and rates are handled by our Events team — I would be happy to connect you with them if needed.\n\nRoom Rate Quotation\n\nTo provide you with an accurate rate quotation, could you kindly share the following details?\n\n- Check-in and check-out dates\n- Number of rooms required\n- Preferred room type (e.g. Executive Club Room, Executive Club Premier Room, Deluxe Room, etc.)\n- Number of guests per room\n\nAirport Transfer\n\nAs your flight arrives at 9:00am, you may also wish to arrange an airport transfer for a seamless arrival. We offer the following options from Shenzhen Bao'an International Airport (SZX):\n\nVehicle: Mercedes Benz S Class | Capacity: Up to 3 pax + 3 luggage | Rate: RMB 750 nett per way\nVehicle: Buick GL8 (MPV) | Capacity: Up to 6 pax + 4–6 luggage | Rate: RMB 600 nett per way\n\nTransfers require booking at least 24 hours in advance. Please do let me know if you would like to arrange this.\n\nOnce I have your travel dates and room preferences, I will be delighted to provide a full quotation for your stay.\n\nWe look forward to hearing from you soon. Please do not hesitate to contact us for further assistance.\n\nYours sincerely,\n\nAI Assistant\nCustomer Service Executive\nCustomer Experience Centre\nE. reservations@example-hotels.com\nT. Worldwide Reservations Number", "summary": "Guest Edwin is enquiring about Futian City Hotel. (1) Executive Club Lounge inclusions and breakfast — answered in full. (2) Room rate quotation — travel dates, number of rooms, room type and occupancy are missing; guest has been asked to provide these. (3) Meeting room rates — answered: 2 hrs/day complimentary for Executive Club guests, RMB 280/hr thereafter; non-HC guests referred to Events team. Airport transfer upsell included as guest mentioned 9am flight arrival.", "ms": 34299}], "doc_focus": "Focus 1: Hotel General Information", "doc_focus_key": "F1", "doc_related": "Criteria：准确回答酒店信息与设施", "week": 1}, {"id": "quote", "name": "询价报价 / 暂不预订（No Book Pending Decision）", "tags": ["Focus 2", "Req 11"], "focus": "Focus 2", "difficulty": "中", "diff_reason": "规则（入住人数上限、12 岁算成人、最少入住晚数、满房日期、税费计算）已写在 tools.check_availability；接真实 PMS 需替换该函数的数据来源。", "customize": ["对接 PMS 可用性/价格 API", "增加房型套餐（含早等）", "报价表格式按 Rate Quotation Template 调整"], "verified": "F2：Lakeview 2 大 2 小 → 超出最大入住（2A1C / 1A2C），建议加房并询问孩子年龄；补充年龄后报价 2 间含税 RMB 3,731.20。S4（2027 年日期超出假数据库存）→ 不报价、转人工。", "variants": [{ e are counted as adults.\n\nOnce we have this information, we will be glad to send you a full quotation right away.\n\nWe look forward to hearing from you soon. Please do not hesitate to contact us for further assistance.\n\nYours sincerely,\n\nAI Assistant\nCustomer Service Executive\nCustomer Experience Centre\nE. reservations@example-hotels.com\nT. Worldwide Reservations Number", "summary": "Guest requested a quote for a Lakeview Room, 1–3 Jul 2026, 2 adults 2 children. Lakeview Room max occupancy is 2A1C or 1A2C — cannot accommodate the party. Suggested Premier Room, Lakeview as alternative. Children's ages are required to complete the availability check. Awaiting guest reply.", "ms": 24452}, {"key": "S4-1", "label": "Sample 4：Lakeside Hotel 2027 年报价", "triage": "type=NEW evidence=none route=AI mode=AUTO lang=en dcodes=RSV-QUOTE,RSV-SPECIAL hotel=HGH1 reason=none", "result": "disposition=HUMAN_REVIEW team=RESERVATIONS grounding=13/13 actions=none esc=Availability data for July 2027 is outside the system's inventory window; human agent must verify rates and availability before quoting.", "tools": "[('check_availability', 'NO_INVENTORY_DATA'), ('check_availability', 'NO_INVENTORY_DATA'), ('search_knowledge_base', 'OK'), ('search_knowledge_base', 'OK')]", "reply": "Dear Kimberly,\n\nGreetings from Example Hotel Group!\n\nThank you for choosing Example Hotels & Resorts as the preferred accommodation.\n\nThank you so much for reaching out to us, and warmest congratulations in advance on your upcoming 11th wedding anniversary! What a wonderful way to celebrate — we would be truly honoured to be part of this special milestone for you and your husband.\n\nWe are delighted to introduce Lakeside Hotel Hangzhou — our newest and most intimate property, nestled right on the shores of the UNESCO-listed West Lake. With only 68 rooms across five floors, the hotel blends the elegance of a merchant heritage with modern luxury. Highlights include:\n\n- Breathtaking West Lake and mountain views, with rooms offering up to 270-degree panoramas\n- A rooftop Sky Garden with sunrise and sunset decks overlooking the lake\n- Acclaimed dining at Golden Lotus restaurant, guided by Michelin-starred and Black Pearl culinary talent\n- An authentic Tea Room featuring 18 tea ceremonies\n- Wellness Club, gym, and swimming pool\n- Personal Host Service for every guest\n\nRegarding your requested travel dates of 11–15 July 2027 (4 nights) and 24–27 July 2027 (3 nights) for 2 adults, our reservations team is currently in the process of confirming availability and rates for 2027. A dedicated colleague will follow up with a full quotation for both date options as soon as possible.\n\nIn the meantime, we have noted your 11th wedding anniversary celebration, and we would love to arrange something truly special to make your stay unforgettable. Our team will be happy to discuss anniversary amenity arrangements and room decoration options when we revert with the quotation — all subject to availability.\n\nTo help us prepare the most suitable options for you, may we also ask:\n\n- Do you have a preferred room type in mind (e.g. lakeview, garden view, or a suite)?\n- Will you be arriving by flight? If so, we would be glad to assist with airport transfer arrangements as well.\n\nWe look forward to welcoming you to Lakeside Hotel for this very special occasion.\n\nWe look forward to hearing from you soon. Please do not hesitate to contact us for further assistance.\n\nYours sincerely,\n\nAI Assistant\nCustomer Service Executive\nCustomer Experience Centre\nE. reservations@example-hotels.com\nT. Worldwide Reservations Number", "summary": "Guest Kimberly Chow enquires about a rate quotation for Lakeside Hotel Hangzhou for 2 adults on two date options: 11–15 Jul 2027 and 24–27 Jul 2027, for her 11th wedding anniversary. AI could not quote as inventory data only covers up to Jul 2026 (NO_INVENTORY_DATA). Agent to check 2027 availability and provide full quotation for both date options, and follow up on anniversary arrangement details. Guest's preferred room type and flight/transfer needs are also outstanding.", "ms": 30860}], "doc_focus": "Area 2: Make Reservation", "doc_focus_key": "A2", "doc_related": "Sample：Lakeview 2 大 2 小报价；No Book Pending Decision", "week": 2}, {"id": "book", "name": "预订：查房 + 下单 + 回顾（Check Available Book）", "tags": ["Sample 1", "Req 11", "Logic 1"], "focus": "Area 2", "difficulty": "中", "diff_reason": "必填信息校验与下单都在 tools.create_reservation；下单记录写入 DynamoDB（满足 General Logic #1）。接 PMS 写接口需替换 _save_reservation。", "customize": ["对接 PMS 建单 API 与担保链接", "加入追加销售规则（接机仅限乘机客人）", "确认函格式按 Reservation Confirmation template"], "verified": "Sample 1：第一封缺孩子年龄 → 追问并解答加床、提前入住、接机、儿童活动；第二封补齐后创建 3 张订单（每间一个 11 位确认号），回顾含税总价 MYR 12,273.60 与 48 小时担保说明。", "variants": [{"name": "缺必填信息", "steps": [[0, "客人发来邮件", "发往 reservations@ / rewards@ / 各酒店预订邮箱。SES 收信，正文与附件存入实例的 S3 存储。"], [1, "入站 Email Flow", "CheckEmailChannel：$.Channel = EMAIL；开启 flow 日志。"], [2, "triage：读信", "flow 同步调用 triage（8 秒）。ListContactReferences + GetAttachedFile 读取正文与附件清单。"], [2, "新邮件 / 回复判定", "DescribeContact 取 Connect 线程字段：新邮件没有 RelatedContactId 且 ContactAssociationId 等于自身；回复邮件的 RelatedContactId 指向它回复的那封（我们发出的 outbound），ContactAssociationId 指向线程根。依次匹配 RelatedContactId → 其上一跳 → 线程根 → [Ref: EA-xxxx] 案例号 → 回复前缀 + 同主题未结案例；Fwd 转发按新邮件处理。", "d"], [2, "防护 + Claude Haiku 分类", "SES 垃圾/病毒判定、自动回复/退信、聊天转邮件、钓鱼特征；Haiku 识别语言、多意图 Dcode、酒店、情绪、投诉、是否要求人工。"], [4, "案例写入 DynamoDB", "CASE（案例状态）、THREAD（联系→案例）、CUSTOMER（发件人最近案例）。"], [3, "异步启动 agent", "Lambda Invoke(Event)。flow 进入 Wait 10s ⇄ poll 循环等待结果（最多 30 次）。"], [3, "抽取预订信息", "必填：酒店、日期、姓名、人数与孩子年龄、房间数、房型。", "d"], [4, "check_availability", "孩子年龄缺失 → NEED_CHILD_AGES。"], [4, "search_knowledge_base ×4", "加床、提前入住、接机、儿童活动。"], [3, "起草：列出缺失项 + 其他问题答案", "expects_reply=true → “We look forward to hearing from you soon.”"], [3, "grounding 自检", "第二次 Claude 调用逐条核对回复中的事实是否有 KB / 工具证据；有无证据的陈述则转人工审核。", "d"], [3, "模板组信", "代码拼接：称呼 + 标准问候（首次/再次/示例会员俱乐部）+ 正文 + 标准结束语 + 所在 reetings from Example Hotel Group!\n\nThank you for choosing Example Hotels & Resorts as the preferred accommodation.\n\nThank you so much for choosing Seaview Resort, Penang for your upcoming family holiday — and a very happy birthday in advance! We would be absolutely delighted to celebrate this special occasion with you and your loved ones.\n\nWe have reviewed your booking request and are happy to assist. Before we can confirm the reservation, we kindly need a little more information:\n\nChild ages required\n\nCould you please share the ages of the children in the following rooms? (Children aged 12 and above are counted as adults.)\n\n- Room 1 – Premier Wing Premier Superior Room: age of the 1 child\n- Room 3 – Premier Wing Premier Deluxe Room: ages of the 2 children\n\nOnce we have these details, we will proceed with the booking right away under your name on the Flexible Rate for 2–6 September 2026.\n\n\nIn the meantime, here are the answers to your other questions:\n\nExtra Bed\n\nAn extra rollaway bed or baby cot can be arranged — please note that only one extra bed or one baby cot is permitted per room, subject to availability. Specific charges vary and will be confirmed by the hotel; we will note your request and the team will advise upon check-in. Please let us know which room(s) you would like the extra bed for.\n\nEarly Check-In\n\nOur standard check-in time is 15:00. As you are arriving at 8:00 am, early check-in is subject to room availability on the day of arrival. Should the room not be ready, you are welcome to store your luggage with the concierge and enjoy the resort's facilities in the meantime. For a guaranteed early check-in, an additional charge may apply — please let us know if you would like us to note this as a confirmed request, and the hotel will advise on the applicable rate.\n\nAirport Transfer\n\nWe offer the following limousine transfer options between Penang International Airport (PEN) and the resort (approximately 45–60 minutes):\n\nVehicle: Mercedes Benz S Class | Capacity: Up to 3 pax + 3 luggages | Rate: MYR 250++ per car, per way\nVehicle: Toyota Alphard | Capacity: Up to 5 pax + 5 luggages | Rate: MYR 350++ per car, per way\n\nPlease note that a 50% midnight surcharge applies for transfers between 11:00 pm and 7:00 am. A credit card guarantee is required at the time of booking, and cancellations made less than 4 hours prior to pick-up will incur a 100% charge. Kindly share your flight details and we will be happy to arrange this for you.\n\nKids' Activities\n\nGreat news for the little ones! Seaview Resort guests have full access to the kids' facilities at the neighbouring Beachfront Resort, Penang, which include:\n\n- Adventure Zone – an exciting outdoor play area (children must wear long-sleeved shirts and socks)\n- Cool Zone Kids' Club – located on the Mezzanine Level of the Adventure Zone, offering daily supervised activities for children aged 5 to 12 years old (some activities are chargeable)\n\nBirthday Celebration\n\nTo make your birthday truly memorable, we would love to arrange a special room decoration for you. We will be delighted to share the available options and rates once your booking is confirmed — please do let us know if you would like us to arrange something special.\n\nWe look forward to hearing from you with the children's ages so we can finalise your reservation without delay!\n\nWe look forward to hearing from you soon. Please do not hesitate to contact us for further assistance.\n\nYours sincerely,\n\nAI Assistant\nCustomer Service Executive\nCustomer Experience Centre\nE. reservations@example-hotels.com\nT. Worldwide Reservations Number", "summary": "Guest Ms. Mary White requests 3 rooms at PEN1 (2–6 Sep 2026, FLEX): Premier Wing Premier Superior Room (2A+1C), Premier Wing Deluxe Suite (2A+1 infant - available MYR 4,091.20 total), Premier Wing Premier Deluxe Room (1A+2C). Booking blocked pending child ages for Rooms 1 and 3. Also asked about extra bed, early check-in, airport transfer (answered), kids activities (answered), same-floor rooms and birthday decoration (noted, pending booking). Awaiting guest reply with child ages.", "ms": 58764}, {"key": "S1-2", "label": "Sample 1 第二封（补充年龄后下单）", "triage": "type=REPLY evidence=case_ref_token:SL-NOUPMEWY,reply_prefix route=AI mode=AUTO lang=en dcodes=RSV-NEW hotel=PEN1 reason=none", "result": "disposition=AUTO_SEND team=RESERVATIONS grounding=40/40 actions=CREATE_RESERVATION,CREATE_RESERVATION,CREATE_RESERVATION esc=none", "tools": "[('check_availability', 'AVAILABLE'), ('get_hotel_policy', 'OK'), ('create_reservation', 'BOOKED'), ('create_reservation', 'BOOKED'), ('create_reservation', 'BOOKED'), ('search_knowledge_base', 'OK'), ('search_knowledge_base', 'OK')]", "reply": "Dear Ms. White,\n\nThank you for your reply.\n\nWonderful news — all three rooms are now confirmed! We are so excited to celebrate your birthday with you and your family at Seaview Resort, Penang. 🎂\n\nHere is a summary of your reservations:\n\nHotel: Room 1: Seaview Resort, Penang; Room 2: Seaview Resort, Penang; Room 3: Seaview Resort, Penang\nConfirmation No.: Room 1: 17392794184; Room 2: 47697661309; Room 3: 11350551006\nGuest Name: Room 1: Ms. Mary White; Room 2: Ms. Mary White; Room 3: Ms. Mary White\nRoom Type: Room 1: Premier Wing Premier Superior Room; Room 2: Premier Wing Deluxe Suite; Room 3: Premier Wing Premier Deluxe Room\nOccupancy: Room 1: 2 adults, 1 child (age 6); Room 2: 2 adults, 1 infant (age 1); Room 3: 1 adult, 2 children (ages 4 & 9)\nCheck-in: Room 1: 2 September 2026; Room 2: 2 September 2026; Room 3: 2 September 2026\nCheck-out: Room 1: 6 September 2026; Room 2: 6 September 2026; Room 3: 6 September 2026\nRate Plan: Room 1: Flexible Rate; Room 2: Flexible Rate; Room 3: Flexible Rate\nTotal (incl. taxes & fees): Room 1: MYR 4,091.20; Room 2: MYR 4,091.20; Room 3: MYR 4,091.20\n\nTotal for all 3 rooms: MYR 12,273.60\n\nRates are inclusive of 10% service charge, 8% SST, MYR 3 Local Government Fee (Penang) per room per night, and MYR 10 tourism tax per room per night (applicable to foreign passport holders).\n\nPayment & Guarantee\nA credit card guarantee link has been sent to you separately for each confirmation number. Please complete the guarantee within 48 hours to avoid automatic cancellation.\n\nCancellation Policy (Flexible Rate)\nCancellations made after 18:00 local hotel time, one day prior to arrival, will be subject to a one-night room charge plus applicable service charges, taxes, and fees.\n\nSpecial Requests Noted (all subject to availability)\n- Rooms near each other on the same floor\n- Early check-in for all rooms — arriving at 8:00 am (standard check-in is 15:00; early check-in is subject to room availability on the day; a charge may apply for a guaranteed early check-in)\n- Birthday room decoration for Ms. White's celebration\n- Baby cot for Room 2 (infant, age 1)\n\nExtra Bed\nPlease do note that only one extra bed or one baby cot is permitted per room, subject to availability. Should you require an extra rollaway bed in any of the rooms, kindly let us know which room(s) and the hotel team will advise on the applicable charges upon check-in.\n\nKids Activities\nYour little ones are in for a treat! PEN1 guests have access to the following kids' facilities at the neighbouring Beachfront Resort, Penang:\n\n- Adventure Zone — an exciting play area (children must wear long sleeves and socks)\n- Cool Zone Kids' Club (Mezzanine Level of Adventure Zone) — daily activities for children aged 5–12 years, open 2:00 pm–6:00 pm; complimentary for in-house guests (selected activities may be chargeable)\n\nDining for the Little Ones\nAs a helpful note, up to 2 children aged 6 and below dining with an adult may enjoy buffet meals at our all-day dining venues at no additional charge. Children above 6 and under 12 receive a 50% discount on the adult buffet price.\n\nAirport Transfer\nAs mentioned previously, we offer the following limousine transfers from Penang International Airport (PEN) to the resort:\n\nVehicle: Mercedes Benz S Class | Capacity: Up to 3 pax + 3 luggages | Rate: MYR 250++ per car, per way\nVehicle: Toyota Alphard | Capacity: Up to 5 pax + 5 luggages | Rate: MYR 350++ per car, per way\n\nGiven your group size, we would recommend the Toyota Alphard for a comfortable journey. A 50% midnight surcharge applies for transfers between 11:00 pm and 7:00 am. Kindly share your flight details and we will be happy to arrange this for you.\n\nWe look forward to welcoming you and your family for a truly memorable birthday celebration, Ms. White. Please do not hesitate to reach out should you need anything further!\n\nWe look forward to hearing from you soon. Please do not hesitate to contact us for further assistance.\n\nYours sincerely,\n\nAI Assistant\nCustomer Service Executive\nCustomer Experience Centre\nE. reservations@example-hotels.com\nT. Worldwide Reservations Number", "summary": "Guest Mary White provided children's ages (6, 1, 4 & 9). AI confirmed all 3 rooms (Premier Wing Premier Superior Room #17392794184, Premier Wing Deluxe Suite #47697661309, Premier Wing Premier Deluxe Room #11350551006) for 2–6 Sep 2026, Flexible Rate, total MYR 12,273.60. Special requests noted: same floor, early check-in, birthday decoration, baby cot. Awaiting flight details for airport transfer arrangement.", "ms": 51053}], "doc_focus": "Area 2: Make Reservation", "doc_focus_key": "A2", "doc_related": "Criteria：直接写入系统完成预订；General Logic #1", "week": 3}, {"id": "reconfirm", "name": "订单确认与特殊要求（加床、早餐、提前入住、航班）", "tags": ["Sample 2", "Sample 3", "Req 11"], "focus": "Area 2", "difficulty": "中", "diff_reason": "身份校验（确认号 + 姓名 + 邮箱/手机）与备注写入在 tools.find_reservation / update_reservation；接 PMS reservation/detail 与备注 API 即可。", "customize": ["对接 Open API reservation/detail（返回结构已按其设计）", "特殊要求代码映射到 PMS specials", "酒店差异化提前入住收费"], "verified": "Sample 2：校验订单 12345678910，加床备注写入，说明早餐只含 3 位成人并按儿童餐政策询问孩子年龄。Sample 3：航班与提前入住备注写入，说明提前入住收费分段。" \nThank you for reaching out, and we are truly delighted to welcome you and your family to Futian City Hotel, Shenzhen this coming January!\n\n1. Pre-Installation of the Extra Rollaway Bed\n\nWe have noted your request and added a remark to your reservation (Confirmation No. 12345678910) to have the rollaway bed set up and ready in your room prior to your arrival. Please be assured that our team will do their very best to accommodate this. As with all special requests, this is subject to availability and hotel operations on the day; however, we will make every effort to ensure your room is fully prepared so you can rest comfortably right away.\n\n2. Breakfast for All 4 Guests\n\nWe have reviewed your booking and can confirm that your current package includes daily breakfast for 3 adults. The child's breakfast is not included within the package itself.\n\nAs your reservation is linked to a Example Rewards membership, our Children's Meal Policy applies to your child's dining as follows:\n\nChild's Age: Breakfast Charge (LOYALTY Member – Registered In-House Guest)\n0 – 6 years: Complimentary (up to 2 children per room, accompanied by at least 1 dining adult)\n7 – 11 years: 50% discount off the adult buffet price\n12 years and above: Full charge (considered an adult)\n\nTo confirm the exact arrangement for your child, could you kindly let us know your child's date of birth or current age? This will allow us to advise you precisely on whether breakfast will be complimentary or at a discounted rate.\n\nWe look forward to hearing from you and to making your stay a truly memorable one!\n\nWe look forward to hearing from you soon. Please do not hesitate to contact us for further assistance.\n\nYours sincerely,\nAI Assistant\nCustomer Sales Executive\nFutian City Hotel, Shenzhen\nE. reservations.szx1@example-hotels.com\nT. +00 0000 0000\nExample Road, Futian District, Shenzhen 518048, Guangdong Province, China\nexample-hotels.com", "summary": "Guest (Test Kim, conf. 123456789 750 pts ≈ USD 50). Invited guest to proceed with booking details and noted verification will be required before redemption booking.", "ms": 23420}, {"key": "S8-1", "label": "Sample 8：积分用途", "triage": "type=NEW evidence=none route=AI mode=AUTO lang=en dcodes=LOYALTY-EARN-REDEEM hotel=none reason=none", "result": "disposition=AUTO_SEND team=LOYALTY grounding=14/14 actions=none esc=none", "tools": "[('search_knowledge_base', 'OK'), ('search_knowledge_base', 'OK'), ('search_knowledge_base', 'OK')]", "reply": "Dear Jane,\n\nGreetings from Example Rewards Member Services.\n\nThank you for being a valued Example Rewards member! It is our pleasure to walk you through what you can do with your hard-earned Points.\n\nWhat can you redeem with your Points?\n\nYour Points can be used in several ways, all at a redemption rate of 15 Points = USD 1:\n\n- Instant Redemption Awards — Present your dynamic QR code from the Example Rewards Mobile App to offset your bill at participating food & beverage and Chi, The Spa outlets directly.\n\n- Cash & Points (Room Award) — Yes, you can absolutely redeem for rooms! When booking a stay under the Flexible Rate or Flexible Rate with Breakfast for selected room types, you may settle part or all of the room charges using a combination of cash and Points. A minimum of 500 Points is required per redemption. The remaining balance is settled upon arrival.\n\n- Non-Room Awards — Redeem dining vouchers or Chi, The Spa vouchers at participating outlets. Vouchers are valid for 180 days from the date of redemption.\n\n- e-Gift Cards & Lifestyle Awards — Additional options are available through the Example Rewards website and Mobile App.\n\nPlease note that Points pooling with other members is not permitted; all Points must be earned under your own account.\n\nWhen do your Points expire?\n\nPoints expire on an annual basis. Specifically, Points earned in any calendar year (1 January – 31 December) will expire on the second anniversary of the end of that calendar year. For example:\n- Points earned anytime in 2025 will expire on 31 December 2027.\n- Points expire at 00:00 (GMT+8) on 1 January of the expiry year.\n\nTo check your exact Points balance and expiry date, you may log in to the Example Rewards Mobile App or visit the Example Rewards website.\n\nShould you wish to make a Cash & Points redemption booking, please do not hesitate to reach out and we will be happy to assist. We look forward to welcoming you back to Example Hotel!\n\nThank you for writing to us. Please do not hesitate to contact us should you require further assistance.\n\nYours sincerely,\nAI Assistant\nMember Service Executive, Example Rewards Member Services\nExample Hotel Management Ltd.\nE. rewards@example-hotels.com\nT. +00 0000 0000\nExample Tower, Example Road, Hong Kong SAR\nexample-hotels.com\nGet the most out of your points. Click here to explore the exciting lifestyle rewards!", "summary": "Guest Jane asked about LOYALTY points redemption options, expiry, and whether points can be redeemed for rooms. All three questions answered from KB without verification (general policy questions). No account-specific data requested. No action outstanding.", "ms": 27633}], "doc_focus": "Focus 4: Example Rewards - Earn & Redeem", "doc_focus_key": "F4", "doc_related": "Sample：750 分用于 Cash & Points（最少 500 分）", "week": 4}, {"id": "partial", "name": "多问题邮件：能答先答，其余升级人工", "tags": ["General Logic #2", "Req 10"], "focus": "通用", "difficulty": "低", "diff_reason": "由 submit_reply.items 的逐题状态驱动；任一题 UNANSWERED/ESCALATED 即 ESCALATE，草稿保留已答部分。", "customize": ["调整哪些 Dcode 必须人工", "草稿展示位置（联系属性 / Cases / Task）"], "verified": "Z1：停车费（KB 内容不完整）+ 接机价格 + 要求人工 → 已答部分写入草稿，open_items 列出未答项，进入人工队列。", "variants": [{"name": "部分可答", "steps": [[0, "客人发来邮件", "发往 reservations@ / rewards@ / 各酒店预订邮箱。SES 收信，正文与附件存入实例的 S3 存储。"], [1, "入站 Email Flow", "CheckEmailChannel：$.Channel = EMAIL；开启 flow 日志。"], [2, "triage：读信", "flow 同步调用 triage（8 秒）。ListContactReferences + GetAttachedFile 读取正文与附件清单。"], [2, "新邮件 / 回复判定", "DescribeContact 取 Connect 线程字段：新邮件没有 RelatedContactId 且 ContactAssociationId 等于自身；回复邮件的 RelatedContactId 指向它回复的那封（我们发出的 outbound），ContactAssociationId 指向线程根。依次匹配 RelatedContactId → 其上一跳 → 线程根 → [Ref: EA-xxxx] 案例号 → 回复前缀 + 同主题未结案例；Fwd 转发按新邮件处理。", "d"], [2, "防护 + Claude Haiku 分类", "SES 垃圾/病毒判定、自动回复/退信、聊天转邮件、钓鱼特征；Haiku 识别语言、多意图 Dcode、酒店、情绪、投诉、是否要求人工。"], [4, "案例写入 DynamoDB", "CASE（案例状态）、THREAD（联系→案例）、CUSTOMER（发件人最近案例）。"], [3, "异步启动 agent", "Lambda Invoke(Event)。flow 进入 Wait 10s ⇄ poll 循环等待结果（最多 30 次）。"], [4, "逐题检索 / 调工具", ""], [3, "逐题标记状态", "ANSWERED / NEED_MORE_INFO / UNANSWERED；知识缺口进报表。", "d"], [3, "grounding 自检 + 升级判断", "存在未答问题 → ESCALATE，草稿含已答部分。", "d"], [1, "poll 取回结果", "disposition = HUMAN_REVIEW / ESCALATE，AI 草稿、摘要、未答问题写入联系属性。"], [1, "设置队列：RESERVATIONS", "Compare team → Set working queue → Transfer to queue。"], [5, "坐席处理", "坐席在 Agent Workspace 看到 reply_body（AI 草稿）、ai_summary、open_items，只需补充未解决部分后发送。", "h"]]}], "examples": [{"key": "Z1-1", "label": "Z1：简体中文，停车 + 接机 + 要求人工", "triage": "type=NEW evidence=none route=AI mode=DRAFT_ONLY lang=zh-CN dcodes=HTL-INFO,OTH-OTHER hotel=SZX1 reason=guest asked for a human agent", "result": "disposition=ESCALATE team=RESERVATIONS grounding=30/30 actions=none esc=1. 餐饮客人停车收费信息在知识库中不完整（内容被截断），需人工确认后补充回复。2. 客人明确要求人工客服主动联系，需安排同事跟进。", "tools": "[('search_knowledge_base', 'OK'), ('search_knowledge_base', 'OK'), ('search_knowledge_base', 'OK'), ('search_knowledge_base', 'OK'), ('search_knowledge_base', 'OK'), ('search_knowledge_base', 'OK'), ('search_knowledge_base', 'OK')]", "reply": "尊敬的王先生：\n\n示例酒店集团向您致以诚挚的问候！\n\n感谢您选择示例酒店及度假酒店作为您的首选下榻之处。\n\n感谢您联系深圳福田城市酒店，很高兴为您提供以下信息。\n\n一、停车场收费\n\n酒店设有室内停车场，具体收费如下：\n\n- 住店客人：免费\n- 餐饮客人：系统中相关详细收费信息暂不完整，我们已将此问题转交人工客服，将尽快为您确认并回复。\n\n二、机场及交通接送价格\n\n以下为酒店专车接送报价（含高速过路费及停车费，单程）：\n\n车型: 奔驰 S300（1C） | 载客人数: 最多3人 | 深圳宝安国际机场 (SZX): RMB 750 | 广州白云国际机场 (CAN): RMB 2,800 | 罗湖火车站 (SZS): RMB 550 | 深圳北站 (SZN): RMB 650 | 蛇口码头 (SKO): RMB 650 | 福永港: RMB 750\n车型: 别克 GL8（11B） | 载客人数: 最多6人 | 深圳宝安国际机场 (SZX): RMB 600 | 广州白云国际机场 (CAN): RMB 2,300 | 罗湖火车站 (SZS): RMB 450 | 深圳北站 (SZN): 请见下注 | 蛇口码头 (SKO): 请见下注 | 福永港: 请见下注\n车型: 大巴（40U，45座） | 载客人数: 团体 | 深圳宝安国际机场 (SZX): RMB 1,400 | 广州白云国际机场 (CAN): RMB 3,000 | 罗湖火车站 (SZS): RMB 1,000 | 深圳北站 (SZN): RMB 1,200 | 蛇口码头 (SKO): RMB 1,200 | 福永港: RMB 1,400\n\n往返香港专线（奔驰 S350 / 丰田 Alphard，最多3-6人）：\n- 香港国际机场 (HKG) / 港岛 / 九龙 → RMB 2,000 / 单程\n\n温馨提示：\n- 接送服务须提前 24小时 预约；当日预约请直接联系礼宾部确认。\n- 取消政策：出发前 4小时内 取消将收取全额费用。\n- 包车服务（市内）：最少2小时起，RMB 650/小时（奔驰 S300）；超出15分钟按1小时计费。\n\n三、人工客服\n\n我们已收到您希望与人工客服联系的请求，我们的同事将尽快主动与您联系。如有紧急需求，也欢迎直接致电酒店。\n\n如有任何其他问题，请随时告知，我们期待为您服务。\n\n感谢您的来信。如需进一步协助，请随时与我们联系。\n\n此致，\n\nAI 助理\n客户服务专员\n客户体验中心\nE. reservations@example-hotels.com\nT. 全球预订热线", "summary": "王先生询问深圳福田城市酒店停车收费及机场接送价格，并要求人工客服主动联系。机场接送价格已从KB完整回复；住店客人停车免费已确认，但餐饮客人停车收费信息在KB中被截断，需人工补充确认。请安排同事主动联系王先生（wang@example.cn）。", "ms": 40076}], "doc_focus": "功能评估准则（文档 Focus 前的 8 条 criteria）", "doc_focus_key": "C", "doc_related": "Criteria：多问题邮件 / 需人工确认后再回复；General Logic #2", "week": 2}, {"id": "complaint", "name": "投诉 / 情绪 / 要求人工（含脏话语气）", "tags": ["Req 10", "Req 14 情绪", "Tone SOP"], "focus": "通用", "difficulty": "低", "diff_reason": "Haiku 标记 complaint / explicit_human_request / 负面情绪 → DRAFT_ONLY；语气规则在提示词中。", "customize": ["升级阈值（仅投诉 / 负面情绪也升级）", "补偿政策入库后可让 AI 提供方案"], "verified": "G3：脏话 + 空调故障 + 要求赔偿 → 共情草稿（不承诺赔偿），ESCALATE 到 GENERAL 队列。", "variants": [{"name": "投诉", "steps": [[0, "客人发来邮件", "发往 reservations@ / rewards@ / 各酒店预订邮箱。SES 收信，正文与附件存入实例的 S3 存储。"], [1, "入站 Email Flow", "CheckEmailChannel：$.Channel = EMAIL；开启 flow 日志。"], [2, "triage：读信", "flow 同步调用 triage（8 秒）。ListContactReferences + GetAttachedFile 读取正文与附件清单。"], [2, "新邮件 / 回复判定", "DescribeContact 取 Connect 线程字段：新邮件没有 RelatedContactId 且 ContactAssociationId 等于自身；回复邮件的 RelatedContactId 指向它回复的那封（我们发出的 outbound），ContactAssociationId 指向线程根。依次匹配 RelatedContactId → 其上一跳 → 线程根 → [Ref: EA-xxxx] 案例号 → 回复前缀 + 同主题未结案例；Fwd 转发按新邮件处理。", "d"], [2, "Haiku：complaint=true", "ai_mode=DRAFT_ONLY：AI 只起草，不自动发送。", "d"], [4, "案例写入 DynamoDB", "CASE（案例状态）、THREAD（联系→案例）、CUSTOMER（发件人最近案例）。"], [3, "异步启动 agent", "Lambda Invoke(Event)。flow 进入 Wait 10s ⇄ poll 循环等待结果（最多 30 次）。"], [3, "共情草稿", "先共情、承担责任、不辩解、不承诺未授权补偿。"], [3, "grounding 自检 + 升级判断", "DRAFT_ONLY → ESCALATE。", "d"], [1, "poll 取回结果", "disposition = HUMAN_REVIEW / ESCALATE，AI 草稿、摘要、未答问题写入联系属性。"], [1, "设置队列：GENERAL", "Compare team → Set working queue → Transfer to queue。"], [5, "坐席处理", "坐席在 Agent Workspace 看到 reply_body（AI 草稿）、ai_summary、open_items，只需补充未解决部分后发送。", "h"]]}], "examples": [{"key": "G3-1", "label": "G3：投诉 + 脏话", "triage": "type=NEW evidence=none route=AI mode=DRAFT_ONLY lang=en dcodes=CMP-COMPLAINT hotel=PEN1 reason=complaint - human handles, AI drafts", "result": "disposition=ESCALATE team=GENERAL grounding=1/4 actions=none esc=Guest is reporting a service failure (broken air-conditioning for two nights, no repair) and is requesting compensation. Compensation decisions require human agent authority. Reservation details (confirmation number, room number, exact dates) are not provided and must be retrieved to investigate the incident. Foul language noted; tone has been de-escalated in the draft.", "tools": "[('search_knowledge_base', 'OK'), ('search_knowledge_base', 'OK')]", "reply": "Dear John,\n\nGreetings from Example Hotel Group!\n\nThank you for choosing Example Hotels & Resorts as the preferred accommodation.\n\nThank you for taking the time to write to us, and please allow me to sincerely apologise for the experience you had during your recent stay at Seaview Resort, Penang.\n\nA malfunctioning air-conditioning unit is far from the standard of comfort we hold ourselves to, and I completely understand how distressing it must have been to endure this for two consecutive nights without a satisfactory resolution. This is not the experience we wish for any of our guests, and I am truly sorry we fell short of your expectations.\n\nYour feedback has been escalated to our Guest Relations team, who will be reviewing the details of your stay , F1 \"free for all guests\") will be routed for human review. Set GROUNDING_GATE=false to disable the gate and retain only report statistics.","deploy_week_1~4.sh 与真实邮箱收发尚未在实例上端到端跑过（读操作和全部写命令的参数已对实例校验）；Lambda 逻辑与 Claude 调用在本地用真实 Bedrock 跑过 20 个场景。":"deploy_week_1~4.sh and real mailbox send/receive have not been run end-to-end on the instance (read operations and all write command parameters have been validated against the instance); Lambda logic and Claude calls have been tested locally with real Bedrock across 20 scenarios.","Focus 1 泳池、Sample 6 Executive Club 能按 KB 正确回复；新邮件 / 回复判定按实例真实联系记录实测（含客人真实回复一封）；no-reply / 退信 / 聊天转邮件不被 AI 回复；繁简英三语回复。":"Focus 1 pool and Sample 6 Executive Club reply correctly from the KB; new email / reply detection validated against real instance contact records (including one real guest reply); no-reply / bounce / chat-to-email contacts are not auto-replied; trilingual replies in Traditional Chinese, Simplified Chinese, and English.","Lakeview 2 大 2 小追问孩子年龄并建议加房；Sample 2 / 3 订单校验后写备注；Sample 4 无库存转人工；多问题邮件能答先答其余升级；投诉进入人工队列并带 AI 草稿。":"Lakeview 2A2C follow-up asks children's ages and suggests an extra room; Sample 2 / 3 write a note after order validation; Sample 4 hands off to a human agent when no availability; multi-issue emails answer what can be answered and escalate the rest; complaints enter the human queue with an AI draft.","Sample 1 两轮邮件后生成 3 张订单并回顾含税总价；再次来信能识别已建订单（General Logic #1）；AP 订单拒绝改期；Sample 5 免费取消返回取消号；有罚金先请客人确认；要求减免转人工。":"Sample 1 generates 3 reservations after two email rounds and recaps the total price including tax; a follow-up email recognises the existing reservations (General Logic #1); Advance Purchase reservations reject date changes; Sample 5 returns a cancellation number for free cancellation; cancellations with a penalty ask the guest to confirm first; waiver requests hand off to a human agent.","Focus 3 改生日：3 项验证→高风险转人工审批；验证失败 3 次锁定；Focus 4 750 分 Cash & Points 正确计算；积分订房后回顾剩余积分；导出 11 项报表 CSV；全场景回归与提示词调优。":"Focu  PMS / Open API / LOYALTY CRM integration is required within 4 weeks, Weeks 3 and 4 each need an additional 1–2 weeks of joint testing — refer to the Medium / Medium-high effort estimates in the customization effort notes. Weekly scripts are cumulative: they re-apply all previous weeks' configuration; scenarios not yet enabled will have AI-drafted replies handed off to a human agent rather than auto-sent.","disposition=AUTO_SEND 的比例（按封、按案例）":"disposition=AUTO_SEND rate (by email, by case)","grounding 自检：有证据的陈述 / 全部陈述":"Grounding self-check: evidenced statements / total statements","triage Dcode 与 agent 最终 Dcode 一致率；预留人工 QA 列":"Triage Dcode vs. agent final Dcode match rate; reserved column for human QA","HUMAN_REVIEW / ESCALATE / 未由 AI 处理":"HUMAN_REVIEW / ESCALATE / not handled by AI","首封即 AUTO_SEND 且无需客人回复，窗口 5 天":"First reply is AUTO_SEND with no guest follow-up required, within a 5-day window","首封到末次回复，AI vs 升级分段":"First email to last reply, segmented by AI-handled vs. escalated","收信到 AI 结果就绪":"Email received → AI result ready","knowledge_gaps（主题、缺失信息、检索段落）":"knowledge_gaps (topic, missing info, retrieved passages)","无未证实陈述的回复比例 + KB 段落链接":"% of replies with no unverified claims + KB passage links","有 Dcode（非 OTH-OTHER）的邮件比例":"% of emails with a Dcode (non-OTH-OTHER)","ESCALATION + CLARIFICATION（追问）比例":"ESCALATION + CLARIFICATION rate","Focus 1 酒店基础信息":"Focus 1 Hotel basic information","已实现，本地验证":"Implemented, verified locally","Focus 2 预订 / 报价":"Focus 2 Reservations / Quotes","Focus 3 LOYALTY 账户":"Focus 3 LOYALTY accounts","Focus 4 LOYALTY 积分":"Focus 4 LOYALTY points","Focus 5 报表":"Focus 5 Reporting","已实现，本地数据验证":"Implemented, verified with local data","复杂多问题 / 需人工确认":"Complex multi-question / requires human confirmation","items 状态 + HUMAN_REVIEW":"items status + HUMAN_REVIEW","已实现":"Implemented","严格遵循 SOP 与假数据":"Strict adherence to SOP and mock data","全部":"All","SOP 在 prompts.py，关键规则在 tools.py 代码强制":"SOP in prompts.py; critical rules enforced in tools.py code"," ubdirectory; setup_kb.sh will prompt for the code; also update SHARED_SCOPES in kb.py and hotels.json","图片型菜单 PDF：setup_kb.sh 选 Bedrock Knowledge Base 并开启 Claude 解析（18 份已列入 kb_gaps.json）":"Image-based menu PDFs: select Bedrock Knowledge Base in setup_kb.sh and enable Claude parsing (18 files already listed in kb_gaps.json)","对接 Sitecore：定时导出到 S3 文档桶，再触发 Knowledge Base 同步":"Integrate with Sitecore: scheduled export to S3 document bucket, then trigger Knowledge Base sync","对接 PMS 可用性/价格 API":"Integrate with PMS availability/rate API","增加房型套餐（含早等）":"Add room type packages (including breakfast, etc.)","报价表格式按 Rate Quotation Template 调整":"Adjust rate quote format per Rate Quotation Template","对接 PMS 建单 API 与担保链接":"Integrate with PMS booking creation API and guarantee link","加入追加销售规则（接机仅限乘机客人）":"Add upsell rules (airport transfer for arriving guests only)","确认函格式按 Reservation Confirmation template":"Format confirmation letters per Reservation Confirmation template","对接 Open API reservation/detail（返回结构已按其设计）":"Integrate with Open API reservation/detail (response structure already designed accordingly)","特殊要求代码映射到 PMS specials":"Map special request codes to PMS specials","酒店差异化提前入住收费":"Hotel-specific early check-in fee differentiation","接 PMS 改单 API":"Integrate with PMS modification API","按渠道/房价码扩展不可改规则":"Extend non-modification rules by channel/rate code","接 PMS 取消 API 与取消函":"Integrate with PMS cancellation API and cancellation letter","减免审批流（目前升级人工）":"Waiver approval workflow (currently escalates to human agent)","CXC-CN 备注格式":"CXC-CN remarks format","对接 LOYALTY CRM（查询/修改/合并/退订）":"Integrate with LOYALTY CRM (query / update / merge / unsubscribe)","风险等级表（LOW_RISK_LOYALTY）":"Risk level table (LOW_RISK_LOYALTY)","验证字段比对规则（地址需完整匹配等）":"Verification field matching rules (address requires exact match, etc.)","接 CRM 实时余额与扣分":"Integrate with CRM for real-time balance and points redemption","按酒店币种换算":"Convert by hotel currency","兑换房型/房价范围":"Redeemable room types/rate ranges","调整哪些 s (max occupancy, age 12 counts as adult, minimum stay, sold-out dates, tax calculation) are implemented in tools.check_availability; connect to a real PMS by replacing the data source in that function.","必填信息校验与下单都在 tools.create_reservation；下单记录写入 DynamoDB（满足 General Logic #1）。接 PMS 写接口需替换 _save_reservation。":"Required field validation and booking are both in tools.create_reservation; reservation records are written to DynamoDB (satisfying General Logic #1). Replace _save_reservation to integrate with a PMS write API.","身份校验（确认号 + 姓名 + 邮箱/手机）与备注写入在 tools.find_reservation / update_reservation；接 PMS reservation/detail 与备注 API 即可。":"Identity verification (confirmation number + name + email/phone) and remarks writing are in tools.find_reservation / update_reservation; integrate with PMS reservation/detail and remarks APIs.","Advance Purchase 不可改、OTA/GDS/团队订单需原渠道处理，已在 update_reservation 强制；改期会重新查房计价。":"Advance Purchase is non-modifiable; OTA/GDS/group bookings must be handled through the original channel — enforced in update_reservation; date changes trigger re-availability check and repricing.","状态分支（在住→前台、已取消→告知、预订中→查政策）、罚金计算、需客人确认、减免需人工，都在 tools.cancel_reservation。":"Status branching (in-stay → front desk, cancelled → inform guest, reserved → check policy), penalty calculation, guest confirmation requirement, and waiver requiring human approval are all in tools.cancel_reservation.","3 项验证、3 次失败锁定、低/高风险分级都在 tools.verify_loyalty_member / update_loyalty_profile 中强制；需要对接 CRM 的查询与修改接口，以及个人数据合规评审。":"3-factor verification, 3-failure lockout, and low/high risk classification are enforced in tools.verify_loyalty_member / update_loyalty_profile; CRM query and update API integration required, along with a personal data compliance review.","一般政策走知识库（低）；15 分 = 1 美元、最少 500 分、仅限会员、兑换前须验证、预订后回顾积分余额在工具里强制（中）。":"General policy goes through the KB (Low); 15 points = $1, minimum 500 points, members only, verification required before redemption, and post-booking points balance review are ntact / returning / Example Rewards) + body + standard closing + official signature for the sending mailbox.","poll 取回结果":"Poll retrieves result","disposition = AUTO_SEND，写入联系属性。":"disposition = AUTO_SEND, write to contact attributes.","CreateContact(RelatedContact=CURRENT) + StartOutboundEmailContact，从客人来信的同一邮箱回复。":"CreateContact(RelatedContact=CURRENT) + StartOutboundEmailContact, reply from the same mailbox the guest wrote to.","客人收到回复":"Guest receives reply","主题带 [Ref: EA-xxxx]，客人回复时可自动归入同一案例。":"Subject includes [Ref: EA-xxxx]; guest replies are automatically threaded into the same case.","客人回复邮件":"Guest replies to email","客人直接回复 AI 的邮件（主题含 [Ref: EA-xxxx]）。":"Guest replies directly to the AI's email (subject contains [Ref: EA-xxxx]).","判定为回复邮件":"Identified as a reply email","Connect 线程字段（RelatedContactId → 上一跳 → ContactAssociationId）命中已知案例，或命中 [Ref: EA-xxxx] 案例号 → 归入原案例；问候语切换为“Thank you for your reply.”；上下文带入历史往来。":"Connect thread fields (RelatedContactId → previous hop → ContactAssociationId) match a known case, or match a [Ref: EA-xxxx] case number → thread into the original case; greeting switches to \"Thank you for your reply.\"; conversation history is included as context.","读取案例历史":"Retrieve case history","最近 6 轮客人来信、AI 回复、系统动作（下单号、验证状态）作为上下文。":"The most recent 6 rounds of guest emails, AI replies, and system actions (order numbers, verification status) are used as context.","Claude 解析指代":"Claude resolves references","“it / that booking / the same dates” 结合历史解析，不要求客人重复信息。":"\"it / that booking / the same dates\" are resolved against history; guests are not asked to repeat information.","flow 内过滤自动发件人":"Filter automated senders within the flow","按官方“Handling email loops”：Compare $.CustomerEndpoint.Address 包含 mailer-daemon / postmaster / noreply / no-reply / bounces+（大小写各一），主题以 Undeliverable: / Mail Delivery Failed 等开头。在调用 Lambda 之前执行。":"Per the official \"Handling email loops\" guidance: compare $.CustomerEndpoint.Address for mailer-daemon / postmaster / no function wrapText(textEl, str, maxChars, x, lineH) {
  const wt = s => [...s].reduce((a, c) => a + (c.charCodeAt(0) > 255 ? 1 : 0.55), 0);
  const lines = []; let cur = "";
  const push = () => { if (cur.trim()) lines.push(cur.trim()); cur = ""; };
  for (const tok of String(str).match(/\s+|[\x21-\x7e\u00a0-\u00ff]+|./gu) || []) {
    if (/^\s+$/.test(tok)) { if (cur) cur += " "; continue; }
    if (wt(cur + tok) <= maxChars) { cur += tok; continue; }
    push();
    let rest = tok;
    while (wt(rest) > maxChars) { let cut = ""; for (const ch of rest) { if (wt(cut + ch) > maxChars) break; cut += ch; } lines.push(cut); rest = rest.slice(cut.length); }
    cur = rest;
  }
  push();
  if (lines.length > 3) { lines.length = 3; lines[2] = lines[2].replace(/.$/u, "…"); }
  lines.forEach((l, i) => { const t = el("tspan", {x, dy: i ? lineH : 0}, textEl); t.textContent = l; });
  return lines.length;
}
